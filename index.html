<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cavalli Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <h1>Cavalli</h1>
        <div id="message" class="message">Press "Draw Card" to start!</div>

        <div class="game-area">
            <div class="board" id="board">
                <!-- Grid will be generated by JS -->
            </div>

            <div class="panel">
                <button id="draw-btn" class="btn">Draw Card</button>
                <button id="reset-btn" class="btn hidden">Play Again</button>

                <div class="drawn-card-wrapper">
                    <h3>Drawn Card:</h3>
                    <div id="drawn-card" class="card-display">
                        <!-- Card will be shown here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
